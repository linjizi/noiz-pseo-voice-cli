[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noiz-pseo-voice-cli"
version = "0.6.5"
description = "CLI for the Noiz voice SEO pipeline (external agent friendly)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
db = ["psycopg2-binary>=2.9"]
dev = ["pytest>=7", "build>=1", "twine>=5"]

[project.urls]
Homepage = "https://github.com/linjizi/noiz-pseo-voice-cli"
Repository = "https://github.com/linjizi/noiz-pseo-voice-cli"
Changelog = "https://github.com/linjizi/noiz-pseo-voice-cli/blob/main/CHANGELOG.md"

[project.scripts]
noiz-pseo-voice = "noiz_pseo_voice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
